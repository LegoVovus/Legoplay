services:
  app:
    build:
      context: .
      target: production-main
      dockerfile: Dockerfile
    ports:
      # Only exposed to localhost. Caddy listens on 5905 (public tunnel entry),
      # routes /ws to the websocket server, and everything else here.
      - "127.0.0.1:5906:3000"
    env_file:
      - website/.env
    environment:
      ORIGIN: https://legoplay.lordpipon.com
    depends_on:
      websocket:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shared_backend
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  websocket:
    build:
      context: .
      target: production-websocket
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8082:8080"
    env_file:
      - website/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shared_backend
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: legoplay-redis
    restart: unless-stopped
    networks:
      - shared_backend
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: legoplay-postgres
    restart: unless-stopped
    networks:
      - shared_backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB come from website/.env
    env_file:
      - website/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  shared_backend:
    driver: bridge

volumes:
  uploads:
  redis_data:
  postgres_data:
